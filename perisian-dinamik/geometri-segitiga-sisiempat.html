<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Geometri Dinamik: Segi Tiga & Sisi Empat</title>
<style>
  :root{
    --bg:#f7f8fb; --card:#ffffff; --text:#1a1d29; --sub:#5a5f73;
    --accent:#2563eb; --accent2:#059669; --border:#e5e7eb; --warn:#d97706;
    --c1:#2563eb; --c2:#dc2626; --c3:#059669; --c4:#7c3aed; --neutral:#9ca3af;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12141c; --card:#1b1e2a; --text:#eef0f6; --sub:#a3a8bf;
      --border:#2c3040;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12141c; --card:#1b1e2a; --text:#eef0f6; --sub:#a3a8bf;
    --border:#2c3040;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; padding:14px; display:flex; justify-content:center;}
  .wrap{max-width:540px; width:100%;}
  h1{font-size:1.15rem; margin:0 0 2px;}
  p.sub{color:var(--sub); margin:0 0 12px; font-size:0.85rem;}
  .tabs{display:flex; gap:6px; margin-bottom:12px;}
  .tab{flex:1; padding:10px; text-align:center; border-radius:10px; border:1px solid var(--border); background:var(--card); font-weight:600; font-size:0.9rem; cursor:pointer;}
  .tab.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:12px;}
  svg{width:100%; height:auto; display:block; touch-action:none; background:var(--bg); border-radius:10px;}
  .badge{font-size:1.05rem; font-weight:700; text-align:center; padding:10px; border-radius:10px; background:var(--bg); margin-bottom:10px;}
  .sumbox{display:flex; align-items:center; justify-content:center; gap:8px; font-size:1.3rem; font-weight:800; padding:10px; border-radius:10px; margin-bottom:8px;}
  .sumbox.ok{background:rgba(5,150,105,0.15); color:var(--accent2);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  table{width:100%; border-collapse:collapse; font-size:0.85rem;}
  th,td{border:1px solid var(--border); padding:6px; text-align:center;}
  th{background:var(--bg); font-weight:600; font-size:0.78rem;}
  .dot{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; vertical-align:middle;}
  .prompt{font-size:0.85rem; color:var(--sub); background:var(--bg); padding:10px; border-radius:10px; margin-top:8px; line-height:1.4;}
  button.reset{width:100%; padding:10px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-weight:600; font-size:0.9rem; cursor:pointer;}
  .stat{display:flex; justify-content:space-between; padding:6px 0; font-size:0.85rem; border-bottom:1px solid var(--border);}
  .stat:last-child{border-bottom:none;}
  .foot{font-size:0.7rem; color:var(--sub); text-align:center; margin-top:6px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>📐 Geometri Dinamik</h1>
  <p class="sub">Alihkan bucu (drag) untuk terokai sifat bentuk. Perhatikan apa yang KEKAL sama walau bentuk berubah.</p>

  <div class="tabs">
    <div class="tab active" id="tabTri">Segi Tiga</div>
    <div class="tab" id="tabQuad">Sisi Empat</div>
  </div>

  <div class="card">
    <div class="badge" id="classBadge">—</div>
    <div class="sumbox" id="sumBox">—</div>
    <div class="stat"><span>Bilangan Paksi Simetri</span><span id="axisCount">—</span></div>
  </div>

  <div class="card">
    <svg id="plane" viewBox="0 0 400 400"></svg>
  </div>

  <div class="card">
    <div class="grid2">
      <div>
        <b style="font-size:0.8rem;">Panjang Sisi (unit)</b>
        <table id="sideTable"></table>
      </div>
      <div>
        <b style="font-size:0.8rem;">Sudut Pedalaman</b>
        <table id="angleTable"></table>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="stat"><span>Perimeter</span><span id="perim">—</span></div>
    <div class="stat"><span>Luas (anggaran)</span><span id="area">—</span></div>
  </div>

  <button class="reset" id="resetBtn">↺ Reset Bentuk</button>
  <div class="prompt" id="promptText"></div>
  <div class="foot" id="spFoot"></div>
</div>

<script>
const svg = document.getElementById('plane');
const COLORS = ['#2563eb','#dc2626','#059669','#7c3aed'];
const NEUTRAL = '#9ca3af';
const TOL_LEN = 0.04;   // 4% toleransi panjang sisi
const TOL_ANG = 2.5;    // darjah toleransi sudut

let shape = 'tri'; // 'tri' or 'quad'
let verts = [];
let dragIdx = -1;

const defaults = {
  tri: [{x:200,y:70},{x:90,y:310},{x:320,y:300}],
  quad: [{x:110,y:90},{x:300,y:100},{x:330,y:290},{x:90,y:300}]
};

function resetShape(){
  verts = defaults[shape].map(p=>({...p}));
  render();
}

document.getElementById('tabTri').onclick = ()=>{ shape='tri'; setTabs(); resetShape(); };
document.getElementById('tabQuad').onclick = ()=>{ shape='quad'; setTabs(); resetShape(); };
document.getElementById('resetBtn').onclick = resetShape;

function setTabs(){
  document.getElementById('tabTri').classList.toggle('active', shape==='tri');
  document.getElementById('tabQuad').classList.toggle('active', shape==='quad');
}

function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

function signedArea(pts){
  let s=0;
  for(let i=0;i<pts.length;i++){
    const p=pts[i], q=pts[(i+1)%pts.length];
    s += p.x*q.y - q.x*p.y;
  }
  return s/2;
}

function centroid(pts){
  let cx=0, cy=0;
  pts.forEach(p=>{cx+=p.x; cy+=p.y;});
  return {x:cx/pts.length, y:cy/pts.length};
}

// Interior angle at each vertex (handles convex + concave correctly)
function interiorAngles(pts){
  const n = pts.length;
  const area = signedArea(pts);
  const orient = area >= 0 ? 1 : -1;
  const angles = [];
  for(let i=0;i<n;i++){
    const prev = pts[(i-1+n)%n];
    const curr = pts[i];
    const next = pts[(i+1)%n];
    const v1 = {x:prev.x-curr.x, y:prev.y-curr.y};
    const v2 = {x:next.x-curr.x, y:next.y-curr.y};
    const dot = v1.x*v2.x + v1.y*v2.y;
    const cross = v1.x*v2.y - v1.y*v2.x;
    const mag1 = Math.hypot(v1.x,v1.y), mag2 = Math.hypot(v2.x,v2.y);
    let raw = Math.acos(Math.max(-1,Math.min(1,dot/(mag1*mag2)))) * 180/Math.PI;
    const crossSign = cross >= 0 ? 1 : -1;
    let interior = (crossSign === orient) ? raw : (360 - raw);
    angles.push(interior);
  }
  return angles;
}

function classifyTriangle(sides, angles){
  const [a,b,c] = sides;
  const avg = (a+b+c)/3;
  const eq = (x,y)=> Math.abs(x-y) < TOL_LEN*avg;
  let sideType, axisCount;
  if(eq(a,b) && eq(b,c)){ sideType='Sama Sisi'; axisCount=3; }
  else if(eq(a,b) || eq(b,c) || eq(a,c)){ sideType='Sama Kaki'; axisCount=1; }
  else { sideType='Tak Sama Kaki'; axisCount=0; }

  const maxA = Math.max(...angles);
  let angType;
  if(Math.abs(maxA-90) < TOL_ANG) angType='Bersudut Tegak';
  else if(maxA > 90+TOL_ANG) angType='Bersudut Cakah';
  else angType='Bersudut Tirus';

  return { name:`Segi Tiga ${sideType}, ${angType}`, axisCount };
}

function classifyQuad(sides, angles){
  const [s0,s1,s2,s3] = sides; // AB, BC, CD, DA
  const avg = sides.reduce((a,b)=>a+b,0)/4;
  const eqLen = (x,y)=> Math.abs(x-y) < TOL_LEN*avg;
  const allRight = angles.every(a=> Math.abs(a-90) < TOL_ANG);
  const allSidesEqual = eqLen(s0,s1) && eqLen(s1,s2) && eqLen(s2,s3);
  const oppEqual = eqLen(s0,s2) && eqLen(s1,s3);

  // parallel check via direction vectors of the 4 sides
  function sideVec(i, pts){
    return {x:pts[(i+1)%4].x-pts[i].x, y:pts[(i+1)%4].y-pts[i].y};
  }
  const v = [sideVec(0,verts), sideVec(1,verts), sideVec(2,verts), sideVec(3,verts)];
  function parallel(u,w){
    const cross = u.x*w.y - u.y*w.x;
    const mag = Math.hypot(u.x,u.y)*Math.hypot(w.x,w.y);
    return Math.abs(cross)/mag < 0.06;
  }
  const par02 = parallel(v[0], v[2]);
  const par13 = parallel(v[1], v[3]);

  if(allSidesEqual && allRight) return {name:'Segi Empat Sama', axisCount:4};
  if(oppEqual && allRight) return {name:'Segi Empat Tepat', axisCount:2};
  if(allSidesEqual) return {name:'Rombus', axisCount:2};
  if(par02 && par13) return {name:'Segi Empat Selari', axisCount:0};

  const kiteAB = eqLen(s0,s1) && eqLen(s2,s3) && !eqLen(s0,s2);
  const kiteBC = eqLen(s1,s2) && eqLen(s3,s0) && !eqLen(s1,s3);
  if(kiteAB || kiteBC) return {name:'Lelayang', axisCount:1};

  if(par02 !== par13) return {name:'Trapezium', axisCount:0};

  return {name:'Sisi Empat Am (belum ada nama khas)', axisCount:0};
}

function polygonArea(pts){ return Math.abs(signedArea(pts)); }

function render(){
  const n = verts.length;
  const angles = interiorAngles(verts);
  const sides = [];
  for(let i=0;i<n;i++) sides.push(dist(verts[i], verts[(i+1)%n]));
  const sumAngles = angles.reduce((a,b)=>a+b,0);
  const expected = (n-2)*180;

  // classify
  const result = (n===3) ? classifyTriangle(sides, angles) : classifyQuad(sides, angles);
  document.getElementById('classBadge').textContent = result.name;
  document.getElementById('axisCount').textContent = result.axisCount;

  const sumBox = document.getElementById('sumBox');
  sumBox.textContent = `Jumlah Sudut = ${sumAngles.toFixed(1)}°  (mesti ${expected}°)`;
  sumBox.className = 'sumbox ' + (Math.abs(sumAngles-expected)<1 ? 'ok':'');

  // side length grouping for colors
  const avg = sides.reduce((a,b)=>a+b,0)/n;
  const sideColors = sides.map(()=>NEUTRAL);
  const usedGroups = [];
  for(let i=0;i<n;i++){
    for(let j=0;j<usedGroups.length;j++){
      if(Math.abs(sides[i]-usedGroups[j].val) < TOL_LEN*avg){
        sideColors[i] = COLORS[j % COLORS.length];
        usedGroups[j].count++;
        matched(i,j); return;
      }
    }
  }
  function matched(){}
  // simpler grouping pass
  const groupOf = new Array(n).fill(-1);
  let groupColors = [];
  for(let i=0;i<n;i++){
    if(groupOf[i]!==-1) continue;
    let matches=[i];
    for(let j=i+1;j<n;j++){
      if(groupOf[j]===-1 && Math.abs(sides[i]-sides[j]) < TOL_LEN*avg) matches.push(j);
    }
    if(matches.length>1){
      const col = COLORS[groupColors.length % COLORS.length];
      groupColors.push(col);
      matches.forEach(m=>groupOf[m]=col);
    }
  }
  for(let i=0;i<n;i++) sideColors[i] = groupOf[i]!==-1 ? groupOf[i] : NEUTRAL;

  // angle grouping
  const angGroupOf = new Array(n).fill(-1);
  let angGroupColors = [];
  for(let i=0;i<n;i++){
    if(angGroupOf[i]!==-1) continue;
    let matches=[i];
    for(let j=i+1;j<n;j++){
      if(angGroupOf[j]===-1 && Math.abs(angles[i]-angles[j]) < TOL_ANG) matches.push(j);
    }
    if(matches.length>1){
      const col = COLORS[angGroupColors.length % COLORS.length];
      angGroupColors.push(col);
      matches.forEach(m=>angGroupOf[m]=col);
    }
  }

  // draw SVG
  svg.innerHTML='';
  const ns='http://www.w3.org/2000/svg';
  function el(tag,attrs){ const e=document.createElementNS(ns,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }

  // polygon fill
  const pointsStr = verts.map(p=>`${p.x},${p.y}`).join(' ');
  svg.appendChild(el('polygon',{points:pointsStr, fill:'var(--accent)', 'fill-opacity':'0.08', stroke:'none'}));

  // sides with color + length label
  const cen = centroid(verts);
  for(let i=0;i<n;i++){
    const p1=verts[i], p2=verts[(i+1)%n];
    svg.appendChild(el('line',{x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y, stroke:sideColors[i], 'stroke-width':3}));
    const mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
    const dx=mx-cen.x, dy=my-cen.y;
    const len=Math.hypot(dx,dy)||1;
    const lx=mx+dx/len*16, ly=my+dy/len*16;
    const t=el('text',{x:lx,y:ly,'text-anchor':'middle','font-size':'12','font-weight':'700',fill:sideColors[i]==='#9ca3af'?'var(--sub)':sideColors[i]});
    t.textContent=(sides[i]/20).toFixed(1);
    svg.appendChild(t);
  }

  // angle labels (toward centroid)
  for(let i=0;i<n;i++){
    const p=verts[i];
    const dx=cen.x-p.x, dy=cen.y-p.y;
    const len=Math.hypot(dx,dy)||1;
    const lx=p.x+dx/len*34, ly=p.y+dy/len*34;
    const col = angGroupOf[i]!==-1 ? angGroupColors[Math.floor(angGroupOf[i]===angGroupOf[i]?0:0)] : 'var(--text)';
    const realCol = angGroupOf[i]!==-1 ? angGroupOf[i] : 'var(--text)';
    const t=el('text',{x:lx,y:ly,'text-anchor':'middle','font-size':'13','font-weight':'800',fill: (typeof realCol==='string' && realCol.startsWith('#')) ? realCol : 'currentColor'});
    t.textContent=angles[i].toFixed(0)+'°';
    svg.appendChild(t);
  }

  // vertices (draggable)
  const labels = ['A','B','C','D'];
  verts.forEach((p,i)=>{
    const c=el('circle',{cx:p.x,cy:p.y,r:11,fill:'var(--card)',stroke:'var(--accent)','stroke-width':3, style:'cursor:grab;'});
    c.dataset.idx=i;
    svg.appendChild(c);
    const lab=el('text',{x:p.x,y:p.y-16,'text-anchor':'middle','font-size':'12','font-weight':'700',fill:'var(--sub)'});
    lab.textContent=labels[i];
    svg.appendChild(lab);
  });

  // tables
  const sideTable = document.getElementById('sideTable');
  let sh='<tr><th>Sisi</th><th>Unit</th></tr>';
  const vlabels = labels.slice(0,n);
  for(let i=0;i<n;i++){
    const a=vlabels[i], b=vlabels[(i+1)%n];
    sh += `<tr><td><span class="dot" style="background:${sideColors[i]}"></span>${a}${b}</td><td>${(sides[i]/20).toFixed(1)}</td></tr>`;
  }
  sideTable.innerHTML = sh;

  const angleTable = document.getElementById('angleTable');
  let ah='<tr><th>Bucu</th><th>Sudut</th></tr>';
  for(let i=0;i<n;i++){
    const col = angGroupOf[i]!==-1 ? angGroupOf[i] : NEUTRAL;
    ah += `<tr><td><span class="dot" style="background:${col}"></span>${vlabels[i]}</td><td>${angles[i].toFixed(0)}°</td></tr>`;
  }
  angleTable.innerHTML = ah;

  document.getElementById('perim').textContent = (sides.reduce((a,b)=>a+b,0)/20).toFixed(1) + ' unit';
  document.getElementById('area').textContent = (polygonArea(verts)/400).toFixed(1) + ' unit²';

  document.getElementById('promptText').textContent = n===3
    ? 'Cuba alihkan bucu A, B, C. Perhatikan: walau apa pun bentuk segi tiga (tirus, tegak, cakah), jumlah sudut pedalaman SENTIASA 180°!'
    : 'Cuba alihkan bucu A, B, C, D. Perhatikan: walau apa pun bentuk sisi empat, jumlah sudut pedalaman SENTIASA 360°! Cuba bentuk segi empat sama, rombus, trapezium dan lelayang.';

  document.getElementById('spFoot').textContent = n===3
    ? 'Selaras SP 7.1.1, 7.1.2, 7.1.3 (KP2027 Matematik Tingkatan 1)'
    : 'Selaras SP 7.3.1, 7.3.2, 7.3.3 (KP2027 Matematik Tingkatan 1)';
}

// Pointer drag handling (mouse + touch unified)
function svgPoint(evt){
  const rect = svg.getBoundingClientRect();
  const scaleX = 400/rect.width, scaleY = 400/rect.height;
  return { x:(evt.clientX-rect.left)*scaleX, y:(evt.clientY-rect.top)*scaleY };
}

svg.addEventListener('pointerdown', (e)=>{
  const p = svgPoint(e);
  let closest=-1, closestDist=9999;
  verts.forEach((v,i)=>{
    const d = dist(v,p);
    if(d<closestDist){ closestDist=d; closest=i; }
  });
  if(closestDist < 30){ dragIdx = closest; svg.setPointerCapture(e.pointerId); }
});
svg.addEventListener('pointermove', (e)=>{
  if(dragIdx===-1) return;
  const p = svgPoint(e);
  verts[dragIdx].x = Math.max(15,Math.min(385,p.x));
  verts[dragIdx].y = Math.max(15,Math.min(385,p.y));
  render();
});
svg.addEventListener('pointerup', ()=>{ dragIdx=-1; });
svg.addEventListener('pointercancel', ()=>{ dragIdx=-1; });

resetShape();
</script>
</body>
</html>
