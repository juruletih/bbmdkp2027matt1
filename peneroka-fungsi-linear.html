<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peneroka Fungsi Linear y = mx + c</title>
<style>
  :root{
    --bg:#f7f8fb; --card:#ffffff; --text:#1a1d29; --sub:#5a5f73;
    --accent:#2563eb; --accent2:#dc2626; --grid:#e2e5ee; --axis:#8a8fa3;
    --border:#e5e7eb;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12141c; --card:#1b1e2a; --text:#eef0f6; --sub:#a3a8bf;
      --accent:#60a5fa; --accent2:#f87171; --grid:#2a2e3d; --axis:#5b6079;
      --border:#2c3040;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12141c; --card:#1b1e2a; --text:#eef0f6; --sub:#a3a8bf;
    --accent:#60a5fa; --accent2:#f87171; --grid:#2a2e3d; --axis:#5b6079;
    --border:#2c3040;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    padding:16px; display:flex; justify-content:center;
  }
  .wrap{max-width:520px; width:100%;}
  h1{font-size:1.25rem; margin:0 0 4px;}
  p.sub{color:var(--sub); margin:0 0 16px; font-size:0.9rem;}
  .card{
    background:var(--card); border:1px solid var(--border);
    border-radius:14px; padding:16px; margin-bottom:14px;
  }
  .control{margin-bottom:14px;}
  .control:last-child{margin-bottom:0;}
  .control label{
    display:flex; justify-content:space-between; font-size:0.9rem;
    font-weight:600; margin-bottom:6px;
  }
  .control label span{color:var(--accent); font-weight:700;}
  input[type=range]{width:100%; accent-color:var(--accent);}
  .eq{
    text-align:center; font-size:1.4rem; font-weight:700;
    padding:10px; background:var(--bg); border-radius:10px;
    margin-bottom:14px; letter-spacing:0.5px;
  }
  svg{width:100%; height:auto; display:block; touch-action:none;}
  .info{
    display:grid; grid-template-columns:1fr 1fr; gap:8px;
    font-size:0.85rem;
  }
  .info div{background:var(--bg); border-radius:8px; padding:8px 10px;}
  .info b{display:block; color:var(--sub); font-weight:500; font-size:0.75rem;}
  table{width:100%; border-collapse:collapse; font-size:0.85rem;}
  th,td{border:1px solid var(--border); padding:5px; text-align:center;}
  th{background:var(--bg); font-weight:600;}
</style>
</head>
<body>
<div class="wrap">
  <h1>📐 Peneroka Fungsi Linear</h1>
  <p class="sub">Gerakkan penggelangsar untuk lihat kesan <b>m</b> (kecerunan) dan <b>c</b> (pintasan-y) terhadap graf.</p>

  <div class="card">
    <div class="control">
      <label>Kecerunan, m <span id="mVal">1.0</span></label>
      <input type="range" id="mSlider" min="-5" max="5" step="0.1" value="1">
    </div>
    <div class="control">
      <label>Pintasan-y, c <span id="cVal">0.0</span></label>
      <input type="range" id="cSlider" min="-10" max="10" step="0.5" value="0">
    </div>
  </div>

  <div class="eq" id="eqDisplay">y = 1.0x + 0.0</div>

  <div class="card">
    <svg id="plane" viewBox="0 0 400 400"></svg>
  </div>

  <div class="card">
    <div class="info" id="infoBox"></div>
  </div>

  <div class="card">
    <b style="font-size:0.85rem;">Jadual Nilai</b>
    <table id="valueTable"></table>
  </div>
</div>

<script>
const svgNS = "http://www.w3.org/2000/svg";
const svg = document.getElementById('plane');
const SCALE = 18;      // piksel per unit
const ORIGIN = 200;    // pusat svg (viewBox 400x400)

const mSlider = document.getElementById('mSlider');
const cSlider = document.getElementById('cSlider');
const mVal = document.getElementById('mVal');
const cVal = document.getElementById('cVal');
const eqDisplay = document.getElementById('eqDisplay');
const infoBox = document.getElementById('infoBox');
const valueTable = document.getElementById('valueTable');

function toSvgX(x){ return ORIGIN + x*SCALE; }
function toSvgY(y){ return ORIGIN - y*SCALE; }

function makeEl(tag, attrs){
  const el = document.createElementNS(svgNS, tag);
  for(const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

function drawGrid(){
  const g = makeEl('g', {});
  for(let i=-10;i<=10;i++){
    const isAxis = (i===0);
    g.appendChild(makeEl('line',{
      x1:toSvgX(i), y1:toSvgY(-10), x2:toSvgX(i), y2:toSvgY(10),
      stroke: isAxis ? 'var(--axis)' : 'var(--grid)', 'stroke-width': isAxis?1.5:1
    }));
    g.appendChild(makeEl('line',{
      x1:toSvgX(-10), y1:toSvgY(i), x2:toSvgX(10), y2:toSvgY(i),
      stroke: isAxis ? 'var(--axis)' : 'var(--grid)', 'stroke-width': isAxis?1.5:1
    }));
  }
  return g;
}

function draw(){
  const m = parseFloat(mSlider.value);
  const c = parseFloat(cSlider.value);
  mVal.textContent = m.toFixed(1);
  cVal.textContent = c.toFixed(1);
  eqDisplay.textContent = `y = ${m.toFixed(1)}x + ${c.toFixed(1)}`;

  svg.innerHTML = '';
  svg.setAttribute('viewBox','0 0 400 400');
  svg.appendChild(drawGrid());

  // garis fungsi - clip dengan betul ke sempadan paparan [-10,10] x [-10,10]
  // supaya kecerunan garis TIDAK berubah bila ia keluar dari paparan
  let xA, xB, yA, yB;
  if(m===0){
    if(c>=-10 && c<=10){ xA=-10; xB=10; yA=c; yB=c; }
  } else {
    const xAtYneg10 = (-10-c)/m;
    const xAtYpos10 = (10-c)/m;
    let xStart = Math.max(-10, Math.min(xAtYneg10, xAtYpos10));
    let xEnd   = Math.min(10, Math.max(xAtYneg10, xAtYpos10));
    if(xStart <= xEnd){
      xA=xStart; xB=xEnd; yA=m*xA+c; yB=m*xB+c;
    }
  }
  if(xA!==undefined){
    svg.appendChild(makeEl('line',{
      x1:toSvgX(xA), y1:toSvgY(yA),
      x2:toSvgX(xB), y2:toSvgY(yB),
      stroke:'var(--accent)', 'stroke-width':3
    }));
  }

  // titik pintasan-y
  if(c>=-10 && c<=10){
    svg.appendChild(makeEl('circle',{cx:toSvgX(0), cy:toSvgY(c), r:5, fill:'var(--accent2)'}));
  }

  // titik pintasan-x (jika m tidak 0)
  let xInt = m!==0 ? (-c/m) : null;
  let info = `
    <div><b>Kecerunan (m)</b>${m.toFixed(1)}</div>
    <div><b>Pintasan-y (c)</b>(0, ${c.toFixed(1)})</div>
    <div><b>Pintasan-x</b>${xInt!==null ? '('+xInt.toFixed(2)+', 0)' : 'Tiada (garis mendatar)'}</div>
    <div><b>Jenis kecerunan</b>${m>0?'Positif ↗':m<0?'Negatif ↘':'Sifar (mendatar)'}</div>
  `;
  infoBox.innerHTML = info;

  // jadual nilai
  let rows = '<tr><th>x</th>';
  let xs = [-3,-2,-1,0,1,2,3];
  xs.forEach(x=> rows += `<th>${x}</th>`);
  rows += '</tr><tr><th>y</th>';
  xs.forEach(x=> rows += `<td>${(m*x+c).toFixed(1)}</td>`);
  rows += '</tr>';
  valueTable.innerHTML = rows;
}

mSlider.addEventListener('input', draw);
cSlider.addEventListener('input', draw);
draw();
</script>
</body>
</html>
